 1 name: Build TWRP for EKVATOR                                                 
 2                                                                              
 3 on:                                                                          
 4   workflow_dispatch:                                                         
 5                                                                              
 6 jobs:                                                                        
 7   build:                                                                     
 8     runs-on: ubuntu-22.04                                                    
 9     steps:                                                                   
10       - name: Checkout Device Tree                                           
11         uses: actions/checkout@v3                                            
12                                                                              
13       - name: Set up Build Environment                                       
14         run: |                                                               
15           sudo apt-get update                                                
16           sudo apt-get install -y bc bison build-essential ccache curl flex g
17           git config --global user.name "Builder"                            
