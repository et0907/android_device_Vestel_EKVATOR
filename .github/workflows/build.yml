name: Build TWRP for EKVATOR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v3

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3
          git config --global user.name "Builder"
          git config --global user.email "builder@action.com"

      - name: Install Repo Tool
        run: |
          sudo curl --create-dirs -L -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Initialize OmniROM Manifest
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-11
          
      - name: Sync Dependencies & Inject Device Tree
        run: |
          cd workspace
          repo sync --no-clone-bundle --current-branch --force-sync -j4
          mkdir -p device/vestel
          cp -r ../ device/vestel/EKVATOR/
          
      - name: Start Compilation
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_EKVATOR-eng
          mka recoveryimage

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v3
        with:
          name: twrp-EKVATOR
          path: workspace/out/target/product/EKVATOR/recovery.img
